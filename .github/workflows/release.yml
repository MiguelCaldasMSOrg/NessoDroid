name: Signed Android Release

# Build requirements: four encrypted repository secrets, JDK 25, the checked-in
# Gradle wrapper, and Android SDK/Build Tools from the GitHub Ubuntu runner.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: signed-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Decode production keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?Missing RELEASE_KEYSTORE_BASE64 repository secret}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing RELEASE_KEYSTORE_PASSWORD repository secret}"
          : "${RELEASE_KEY_ALIAS:?Missing RELEASE_KEY_ALIAS repository secret}"
          : "${RELEASE_KEY_PASSWORD:?Missing RELEASE_KEY_PASSWORD repository secret}"
          # Keep private key bytes in runner-temporary storage. Only the path is
          # passed to later Gradle steps; the base64 value is never written to logs.
          keystore_path="$RUNNER_TEMP/nessodroid-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          chmod 600 "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
      - name: Build signed release
        run: bash ./gradlew assembleRelease testDebugUnitTest lintRelease --no-daemon --no-configuration-cache
      - name: Verify signature and checksum
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/NessoDroid-release.apk
          cd dist
          sha256sum NessoDroid-release.apk > NessoDroid-release.apk.sha256
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: NessoDroid-signed-release
          path: |
            dist/NessoDroid-release.apk
            dist/NessoDroid-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/NessoDroid-release.apk dist/NessoDroid-release.apk.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/NessoDroid-release.apk dist/NessoDroid-release.apk.sha256 --verify-tag --generate-notes
          fi
      - name: Remove temporary keystore
        if: always()
        # Cleanup runs after success, failure, or cancellation.
        run: rm -f "$RELEASE_KEYSTORE_PATH"